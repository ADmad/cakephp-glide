name: CI

on:
  push:
    branches:
      - master
      - next
      - '6.x'
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  testsuite:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        glide: ['^3.0', '^4.0']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, pdo_sqlite, gd
          ini-values: zend.assertions=1
          coverage: pcov

      - name: Install dependencies
        run: composer require 'league/glide:${{ matrix.glide }}' --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --display-all-issues --fail-on-all-issues --coverage-clover=coverage.xml

      - name: Code Coverage Report
        if: matrix.glide == '^4.0'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  cs-stan:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          tools: phpstan:2, psalm:6, cs2pr

      - name: Install dependencies
        run: composer require --dev cakephp/cakephp-codesniffer:6.x-dev --no-interaction --prefer-dist

      - name: Run phpcs
        run: vendor/bin/phpcs --report=checkstyle | cs2pr

      - name: Run phpstan
        if: always()
        run: phpstan analyse

      - name: Run psalm
        if: always()
        run: psalm --output-format=github
