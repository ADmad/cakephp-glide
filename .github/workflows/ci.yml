name: CI

on:
  push:
    branches:
      - master
      - cake6
  pull_request:
    branches:
      - '*'

permissions:
  contents: read

jobs:
  testsuite:
    uses: ADmad/.github/.github/workflows/testsuite-without-db.yml@cake6
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  cs-stan:
    uses: ADmad/.github/.github/workflows/cs-stan.yml@cake6
    secrets: inherit
